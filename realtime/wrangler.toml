name = "athena-sync"
main = "src/index.js"
compatibility_date = "2026-06-01"

[[durable_objects.bindings]]
name = "GAME_ROOM"
class_name = "GameRoom"

# SQLite-backed Durable Objects are the kind available on the Workers Free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom"]

[vars]
# Optional: lock the Worker to your own site. Leave empty to allow any page.
# Example: "https://leviskibet.github.io"
ALLOWED_ORIGINS = ""
