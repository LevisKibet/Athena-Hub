<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Athena Game Hub</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="backdrop-overlay"></div>

  <div class="hub-container">
    <header class="top-nav">
      <div class="nav-left">
        <div class="custom-burger" title="Menu">
          <span class="burger-line line-top"></span>
          <span class="burger-line line-bottom"></span>
        </div>
        <span id="live-date">Wed, Aug 19</span>
      </div>

      <nav class="nav-center">
        <a href="index.html" class="nav-link active">Games Hub</a>
        <a href="kahoot.html" class="nav-link">Kahoot Matches</a>
        <div class="hub-badge">
          <i class="fa-solid fa-house"></i> Athena
        </div>
      </nav>

      <div class="nav-right">
        <button id="theme-toggle" class="theme-toggle-btn" title="Toggle Light/Dark Mode">
          <i id="theme-icon" class="fa-solid fa-moon"></i>
        </button>
      </div>
    </header>

    <main>
      <div class="title-section" style="margin-bottom: 2rem;">
        <div class="add-icon-btn">
          <i class="fa-solid fa-plus"></i>
        </div>
        <h1>Athena Game Hub</h1>
      </div>

      <div class="cards-grid">
        <a href="kahoot.html" class="game-card card-kahoot">
          <div class="card-top">
            <span class="status-badge">Trivia Matches</span>
            <i class="fa-solid fa-ellipsis-vertical more-options"></i>
          </div>
          <div class="card-body">
            <div class="play-btn-circle">
              <i class="fa-solid fa-play" style="margin-left: 3px;"></i>
            </div>
            <div class="card-title">Kahoot</div>
            <div class="card-subtitle">Play & join team trivia matches</div>
          </div>
        </a>

        <a href="kenya-50.html" class="game-card card-kenya">
          <div class="card-top">
            <span class="status-badge">Featured</span>
            <i class="fa-solid fa-ellipsis-vertical more-options"></i>
          </div>
          <div class="card-body">
            <div class="play-btn-circle">
              <i class="fa-solid fa-flag"></i>
            </div>
            <div class="card-title">Kenya @ 50</div>
            <div class="card-subtitle">Explore history & heritage</div>
          </div>
        </a>

        <a href="scrabble.html" class="game-card card-scrabble">
          <div class="card-top">
            <span class="status-badge">Strategy</span>
            <i class="fa-solid fa-ellipsis-vertical more-options"></i>
          </div>
          <div class="card-body">
            <div class="play-btn-circle">
              <i class="fa-solid fa-cubes"></i>
            </div>
            <div class="card-title">Scrabble</div>
            <div class="card-subtitle">Word building challenge</div>
          </div>
        </a>

        <div class="game-card card-coming">
          <div class="plus-large">
            <i class="fa-solid fa-circle-plus"></i>
          </div>
          <div class="card-title" style="font-size: 1.2rem;">More Coming</div>
          <div class="card-subtitle">New titles dropping soon</div>
        </div>
      </div>
    </main>

    <footer class="bottom-bar">
      <div class="glow-orb-wrapper">
        <div class="glow-orb"></div>
      </div>

      <div class="hub-status">
        <span>Hub Active</span>
        <div class="avatar-group">
          <div class="avatar" style="background-color: #e63946;">A</div>
          <div class="avatar" style="background-color: #2a9d8f;">G</div>
          <div class="avatar" style="background-color: #e9c46a;">H</div>
        </div>
      </div>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
